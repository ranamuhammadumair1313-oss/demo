<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>UMAIR AI STUDIO</title>
    
    <!-- Include FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Include Marked.js for Markdown parsing in chat -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        :root {
            --primary: #00ffff;
            --primary-glow: rgba(0, 255, 255, 0.4);
            --bg-dark: #0b0f19;
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: radial-gradient(circle at top center, #111827, var(--bg-dark));
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-dark); }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary); }

        header {
            padding: 20px;
            text-align: center;
            font-size: 32px;
            font-weight: 800;
            background: rgba(17, 24, 39, 0.8);
            border-bottom: 1px solid var(--card-border);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            letter-spacing: 2px;
            text-transform: uppercase;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header span {
            color: var(--primary);
            text-shadow: 0 0 15px var(--primary-glow);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 20px;
            flex: 1;
            width: 100%;
        }

        /* Navigation */
        .nav {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .nav button {
            padding: 12px 25px;
            border: 1px solid var(--card-border);
            border-radius: 8px;
            background: rgba(255,255,255,0.05);
            color: var(--text-main);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(5px);
        }

        .nav button:hover, .nav button.active {
            background: var(--primary);
            color: #000;
            border-color: var(--primary);
            box-shadow: 0 0 15px var(--primary-glow);
            transform: translateY(-2px);
        }

        /* Card Layouts */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 30px;
            border-radius: 16px;
            backdrop-filter: blur(15px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            animation: fadeIn 0.4s ease-out;
            display: none; /* Hidden by default */
        }

        .card.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h2 {
            margin-bottom: 25px;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 24px;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 10px;
        }

        /* Inputs & Buttons */
        .input-group {
            margin-bottom: 20px;
        }
        
        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-muted);
            font-size: 14px;
        }

        input[type="text"], input[type="password"], select {
            width: 100%;
            padding: 15px;
            border: 1px solid var(--card-border);
            outline: none;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.2);
            color: white;
            font-size: 16px;
            transition: border 0.3s;
        }

        input:focus, select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 10px var(--primary-glow);
        }

        .action-btn {
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            background: var(--primary);
            color: #000;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
        }

        .action-btn:hover {
            background: #00cccc;
            box-shadow: 0 0 20px var(--primary-glow);
        }

        /* Chat Section */
        .chat-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .chat-box {
            height: 450px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--card-border);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 80%;
            padding: 15px 20px;
            border-radius: 12px;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .message.user {
            background: #2563eb;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .message.ai {
            background: #1f2937;
            color: var(--text-main);
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            border: 1px solid var(--card-border);
        }

        .message.ai pre {
            background: #000;
            padding: 10px;
            border-radius: 8px;
            overflow-x: auto;
            margin-top: 10px;
        }

        .message.ai code {
            font-family: 'Courier New', Courier, monospace;
            color: var(--primary);
        }

        .chat-input-wrapper {
            display: flex;
            gap: 10px;
        }

        .chat-input-wrapper input {
            flex: 1;
            margin-bottom: 0;
        }

        .chat-input-wrapper .action-btn {
            width: auto;
            padding: 0 25px;
        }

        /* Typing Indicator */
        .typing {
            display: flex;
            gap: 5px;
            padding: 15px;
            align-items: center;
            align-self: flex-start;
            color: var(--text-muted);
            font-style: italic;
        }
        .dot {
            width: 6px; height: 6px;
            background: var(--primary);
            border-radius: 50%;
            animation: bounce 1.3s linear infinite;
        }
        .dot:nth-child(2) { animation-delay: -1.1s; }
        .dot:nth-child(3) { animation-delay: -0.9s; }
        
        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-4px); }
        }

        /* Image Analysis specific */
        .image-preview-box {
            width: 100%;
            min-height: 200px;
            border: 2px dashed var(--card-border);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            overflow: hidden;
            background: rgba(0,0,0,0.2);
            position: relative;
        }
        .image-preview-box img {
            max-width: 100%;
            max-height: 300px;
            object-fit: contain;
            display: none;
        }
        .upload-label {
            position: absolute;
            cursor: pointer;
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .upload-label:hover { color: var(--primary); }
        input[type="file"] { display: none; }

        .result-box {
            margin-top: 20px;
            padding: 15px;
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            border: 1px solid var(--card-border);
            min-height: 100px;
        }

    </style>
</head>
<body>

<header>UMAIR AI <span>STUDIO</span></header>

<div class="container">

    <!-- NAVIGATION -->
    <div class="nav">
        <button class="active" onclick="switchTab('chat', this)"><i class="fa-solid fa-comment-dots"></i> AI Chat</button>
        <button onclick="switchTab('image', this)"><i class="fa-solid fa-image"></i> Generate</button>
        <button onclick="switchTab('analyze', this)"><i class="fa-solid fa-eye"></i> Vision</button>
        <button onclick="switchTab('settings', this)"><i class="fa-solid fa-gear"></i> Settings</button>
    </div>

    <!-- 1. CHAT SECTION -->
    <div class="card active" id="chat">
        <h2><i class="fa-solid fa-robot"></i> Advanced AI Assistant</h2>
        <div class="chat-container">
            <div class="chat-box" id="chatBox">
                <div class="message ai">Hello Sir, I am online and ready to assist you.</div>
            </div>
            
            <div class="chat-input-wrapper">
                <input type="text" id="chatInput" placeholder="Type your command here, Sir..." onkeypress="handleEnter(event)" />
                <button class="action-btn" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <!-- 2. IMAGE GENERATION -->
    <div class="card" id="image">
        <h2><i class="fa-solid fa-palette"></i> Image Generator</h2>
        <div class="input-group">
            <label>Describe the image you want to create:</label>
            <input type="text" id="imagePrompt" placeholder="e.g., A futuristic cyberpunk city in neon lights..." />
        </div>
        <button class="action-btn" onclick="generateImage()"><i class="fa-solid fa-wand-magic-sparkles"></i> Generate Artwork</button>
        
        <div class="result-box" id="imageResult">
            <p style="color: var(--text-muted); text-align: center;">Your generated image will appear here.</p>
        </div>
    </div>

    <!-- 3. IMAGE ANALYSIS (VISION) -->
    <div class="card" id="analyze">
        <h2><i class="fa-solid fa-microchip"></i> Vision & Analysis</h2>
        
        <div class="image-preview-box" id="previewBox">
            <label class="upload-label" for="imageUpload" id="uploadText">
                <i class="fa-solid fa-cloud-arrow-up fa-2x"></i>
                <span>Click to Upload Image</span>
            </label>
            <input type="file" id="imageUpload" accept="image/*" onchange="previewImage(event)" />
            <img id="imagePreview" alt="Preview" />
        </div>

        <button class="action-btn" onclick="analyzeImage()"><i class="fa-solid fa-magnifying-glass-chart"></i> Analyze Image</button>
        
        <div class="result-box" id="analysisResult">
            <p style="color: var(--text-muted); text-align: center;">Analysis details will be displayed here.</p>
        </div>
    </div>

    <!-- 4. SETTINGS -->
    <div class="card" id="settings">
        <h2><i class="fa-solid fa-sliders"></i> System Configuration</h2>
        
        <div class="input-group">
            <label>OpenRouter API Key</label>
            <input type="password" id="apiKey" placeholder="sk-or-v1-..." />
        </div>

        <div class="input-group">
            <label>Preferred AI Model</label>
            <select id="modelSelect">
                <option value="openai/gpt-3.5-turbo">GPT-3.5 Turbo (Fast)</option>
                <option value="openai/gpt-4-turbo">GPT-4 Turbo (Advanced)</option>
                <option value="anthropic/claude-3-haiku">Claude 3 Haiku</option>
                <option value="google/gemini-pro">Gemini Pro</option>
            </select>
        </div>

        <button class="action-btn" onclick="saveSettings()"><i class="fa-solid fa-floppy-disk"></i> Save Configuration</button>
        <p id="saveMsg" style="color: #10b981; margin-top: 15px; font-weight: bold; display: none;"><i class="fa-solid fa-check-circle"></i> Settings Saved Successfully.</p>
    </div>

</div>

<script>
    // System Initialization
    let OPENROUTER_API = localStorage.getItem("openrouter_api") || "";
    let SELECTED_MODEL = localStorage.getItem("selected_model") || "openai/gpt-3.5-turbo";

    // Load saved settings on boot
    window.onload = () => {
        if(OPENROUTER_API) document.getElementById("apiKey").value = OPENROUTER_API;
        if(SELECTED_MODEL) document.getElementById("modelSelect").value = SELECTED_MODEL;
    };

    // Tab Switching Logic
    function switchTab(tabId, btnElement) {
        document.querySelectorAll('.card').forEach(card => card.classList.remove('active'));
        document.querySelectorAll('.nav button').forEach(btn => btn.classList.remove('active'));
        
        document.getElementById(tabId).classList.add('active');
        btnElement.classList.add('active');
    }

    // Save Settings
    function saveSettings() {
        OPENROUTER_API = document.getElementById("apiKey").value.trim();
        SELECTED_MODEL = document.getElementById("modelSelect").value;
        
        localStorage.setItem("openrouter_api", OPENROUTER_API);
        localStorage.setItem("selected_model", SELECTED_MODEL);
        
        const msg = document.getElementById("saveMsg");
        msg.style.display = "block";
        setTimeout(() => msg.style.display = "none", 3000);
    }

    // Handle Enter key in chat
    function handleEnter(e) {
        if (e.key === 'Enter') sendMessage();
    }

    // Chat Logic
    async function sendMessage() {
        if (!OPENROUTER_API) {
            alert("Sir, please configure your OpenRouter API key in Settings first.");
            return;
        }

        const input = document.getElementById("chatInput");
        const chatBox = document.getElementById("chatBox");
        const userText = input.value.trim();

        if (!userText) return;

        // Append User Message
        chatBox.innerHTML += `<div class="message user">${userText}</div>`;
        input.value = "";
        
        // Append Typing Indicator
        const typingId = 'typing-' + Date.now();
        chatBox.innerHTML += `
            <div class="typing" id="${typingId}">
                Processing <div class="dot"></div><div class="dot"></div><div class="dot"></div>
            </div>`;
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Authorization": "Bearer " + OPENROUTER_API,
                    "HTTP-Referer": window.location.href, // Recommended by OpenRouter
                    "X-Title": "Umair AI Studio", // Recommended by OpenRouter
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    model: SELECTED_MODEL,
                    messages: [
                        { role: "system", content: "You are an advanced AI assistant in Umair AI Studio. Be helpful, technical, and professional." },
                        { role: "user", content: userText }
                    ]
                })
            });

            const data = await response.json();
            
            // Remove typing indicator
            document.getElementById(typingId).remove();

            if (data.error) {
                chatBox.innerHTML += `<div class="message ai" style="color:#ef4444;">Error: ${data.error.message}</div>`;
            } else {
                const aiReplyRaw = data.choices?.[0]?.message?.content || "No response generated.";
                // Convert Markdown to HTML
                const formattedReply = marked.parse(aiReplyRaw); 
                chatBox.innerHTML += `<div class="message ai">${formattedReply}</div>`;
            }
        } catch (err) {
            document.getElementById(typingId).remove();
            chatBox.innerHTML += `<div class="message ai" style="color:#ef4444;">Network Error: Failed to connect to the API server.</div>`;
        }
        
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    // Image Preview Logic
    function previewImage(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = document.getElementById('imagePreview');
                img.src = e.target.result;
                img.style.display = 'block';
                document.getElementById('uploadText').style.display = 'none';
            }
            reader.readAsDataURL(file);
        }
    }

    // Placeholder: Generate Image
    function generateImage() {
        const prompt = document.getElementById("imagePrompt").value;
        const resultBox = document.getElementById("imageResult");
        
        if(!prompt) {
            alert("Sir, please provide a prompt for the image generation.");
            return;
        }

        resultBox.innerHTML = `
            <div style="text-align:center; padding: 20px;">
                <i class="fa-solid fa-circle-notch fa-spin fa-2x" style="color: var(--primary);"></i>
                <p style="margin-top:10px;">Initializing rendering engine for: "${prompt}"...</p>
                <p style="font-size: 12px; color: var(--text-muted);">(Connect your desired Image API endpoint here)</p>
            </div>
        `;
    }

    // Placeholder: Analyze Image
    function analyzeImage() {
        const fileInput = document.getElementById("imageUpload");
        const resultBox = document.getElementById("analysisResult");

        if(!fileInput.files || fileInput.files.length === 0) {
            alert("Sir, an image upload is required to proceed with the analysis.");
            return;
        }

        resultBox.innerHTML = `
            <div style="text-align:center; padding: 20px;">
                <i class="fa-solid fa-gear fa-spin fa-2x" style="color: var(--primary);"></i>
                <p style="margin-top:10px;">Running visual recognition algorithms...</p>
                <p style="font-size: 12px; color: var(--text-muted);">(Connect Vision API like GPT-4-Vision here)</p>
            </div>
        `;
    }
</script>

</body>
</html>
