<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UMAIR AI STUDIO - PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { background: #020205; color: #e2e8f0; font-family: 'Inter', sans-serif; overflow: hidden; }
        .glass { background: rgba(15, 15, 25, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .neon-blue { box-shadow: 0 0 15px rgba(0, 163, 255, 0.3); border-color: rgba(0, 163, 255, 0.5); }
        .loader { border: 2px solid #f3f3f3; border-top: 2px solid #3498db; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #chat-box::-webkit-scrollbar { width: 4px; }
        #chat-box::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
    </style>
</head>
<body class="flex h-screen w-full">

    <!-- Sidebar -->
    <aside class="w-64 glass border-r border-white/10 hidden md:flex flex-col">
        <div class="p-6 font-bold text-xl tracking-widest text-cyan-400 border-b border-white/5">UMAIR AI</div>
        <div class="flex-1 p-4 overflow-y-auto" id="history">
            <p class="text-xs text-gray-500 uppercase mb-4">Chat History</p>
        </div>
        <button onclick="openSettings()" class="p-4 hover:bg-white/5 flex items-center gap-3 transition">
            <i data-lucide="settings" class="w-5 h-5"></i> Settings
        </button>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col relative">
        <header class="p-4 glass flex justify-between items-center px-8 border-b border-white/10">
            <div class="text-sm font-medium"><span id="active-model-display" class="text-cyan-400">GPT-4o</span> <span class="text-gray-500">| Online</span></div>
            <button onclick="openSettings()" class="md:hidden"><i data-lucide="settings"></i></button>
        </header>

        <!-- Messages Area -->
        <div id="chat-box" class="flex-1 overflow-y-auto p-4 md:p-12 space-y-6">
            <div id="welcome" class="text-center py-20 opacity-40">
                <h1 class="text-4xl font-bold mb-2">UMAIR AI STUDIO</h1>
                <p>Upload an image to analyze or type "generate..." to create art.</p>
            </div>
        </div>

        <!-- Input Area -->
        <div class="p-4 md:p-10">
            <div class="max-w-4xl mx-auto glass rounded-2xl p-2 neon-blue transition-all">
                <div id="preview-area" class="hidden p-2">
                    <img id="img-preview" src="" class="h-20 w-20 object-cover rounded-lg border border-cyan-500">
                </div>
                <div class="flex items-center gap-2">
                    <input type="file" id="file-input" class="hidden" accept="image/*" onchange="previewImage(event)">
                    <button onclick="document.getElementById('file-input').click()" class="p-3 text-gray-400 hover:text-cyan-400"><i data-lucide="paperclip"></i></button>
                    <input type="text" id="user-input" placeholder="Message or 'generate a cyborg'..." class="flex-1 bg-transparent border-none outline-none p-2 text-white">
                    <button onclick="processInput()" id="send-btn" class="bg-cyan-600 hover:bg-cyan-500 text-white p-3 rounded-xl shadow-lg transition-all">
                        <i data-lucide="zap" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- Settings Modal -->
    <div id="settings-modal" class="fixed inset-0 bg-black/90 hidden items-center justify-center z-50 p-4">
        <div class="glass p-8 rounded-3xl w-full max-w-md">
            <h2 class="text-2xl font-bold mb-6 text-cyan-400">System Configuration</h2>
            <div class="space-y-4">
                <div>
                    <label class="text-xs text-gray-500 uppercase">OpenAI API Key</label>
                    <input type="password" id="api-key" placeholder="sk-..." class="w-full bg-white/5 border border-white/10 p-3 rounded-lg outline-none focus:border-cyan-500">
                </div>
                <div>
                    <label class="text-xs text-gray-500 uppercase">Text Model (e.g. gpt-4o, gpt-3.5-turbo)</label>
                    <input type="text" id="model-name" value="gpt-4o" class="w-full bg-white/5 border border-white/10 p-3 rounded-lg outline-none focus:border-cyan-500">
                </div>
                <div>
                    <label class="text-xs text-gray-500 uppercase">Image Model</label>
                    <input type="text" id="img-model" value="dall-e-3" class="w-full bg-white/5 border border-white/10 p-3 rounded-lg outline-none focus:border-cyan-500">
                </div>
                <button onclick="saveConfig()" class="w-full bg-cyan-600 py-3 rounded-xl font-bold hover:bg-cyan-500 transition-all">SAVE & APPLY</button>
                <button onclick="closeSettings()" class="w-full text-gray-500 text-sm">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();
        let selectedBase64 = null;

        function openSettings() {
            const pass = prompt("Enter Admin Password:");
            if(pass === "121845") {
                document.getElementById('settings-modal').style.display = 'flex';
                document.getElementById('api-key').value = localStorage.getItem('umair_key') || '';
                document.getElementById('model-name').value = localStorage.getItem('umair_model') || 'gpt-4o';
            } else { alert("Access Denied!"); }
        }

        function closeSettings() { document.getElementById('settings-modal').style.display = 'none'; }

        function saveConfig() {
            localStorage.setItem('umair_key', document.getElementById('api-key').value);
            localStorage.setItem('umair_model', document.getElementById('model-name').value);
            localStorage.setItem('umair_img_model', document.getElementById('img-model').value);
            document.getElementById('active-model-display').innerText = document.getElementById('model-name').value;
            closeSettings();
        }

        function previewImage(e) {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = () => {
                selectedBase64 = reader.result;
                document.getElementById('img-preview').src = selectedBase64;
                document.getElementById('preview-area').classList.remove('hidden');
            };
            reader.readAsDataURL(file);
        }

        async function processInput() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            const apiKey = localStorage.getItem('umair_key');
            
            if(!apiKey) { alert("Please add API Key in Settings!"); return; }
            if(!text && !selectedBase64) return;

            document.getElementById('welcome').style.display = 'none';
            addMessage('user', text, selectedBase64);
            input.value = '';
            
            const isImageGen = text.toLowerCase().includes('generate');
            
            if(isImageGen) {
                handleImageGeneration(text, apiKey);
            } else {
                handleTextAI(text, selectedBase64, apiKey);
            }
            
            selectedBase64 = null;
            document.getElementById('preview-area').classList.add('hidden');
        }

        async function handleTextAI(prompt, img, key) {
            const chatBox = document.getElementById('chat-box');
            const loaderId = 'loader-' + Date.now();
            chatBox.innerHTML += `<div id="${loaderId}" class="loader"></div>`;
            
            const model = localStorage.getItem('umair_model') || 'gpt-4o';
            
            try {
                const messages = [{ role: "user", content: [] }];
                messages[0].content.push({ type: "text", text: prompt });
                if(img) messages[0].content.push({ type: "image_url", image_url: { url: img } });

                const response = await fetch('https://api.openai.com/v1/chat/completions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${key}` },
                    body: JSON.stringify({ model: model, messages: messages })
                });

                const data = await response.json();
                document.getElementById(loaderId).remove();
                addMessage('ai', data.choices[0].message.content);
            } catch (e) {
                document.getElementById(loaderId).innerText = "Error: API Connection Failed.";
            }
        }

        async function handleImageGeneration(prompt, key) {
            const chatBox = document.getElementById('chat-box');
            const loaderId = 'loader-' + Date.now();
            chatBox.innerHTML += `<div id="${loaderId}" class="text-cyan-400 animate-pulse text-sm">Umair AI is generating your masterpiece...</div>`;
            
            const imgModel = localStorage.getItem('umair_img_model') || 'dall-e-3';

            try {
                const response = await fetch('https://api.openai.com/v1/images/generations', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${key}` },
                    body: JSON.stringify({ model: imgModel, prompt: prompt, n: 1, size: "1024x1024" })
                });

                const data = await response.json();
                document.getElementById(loaderId).remove();
                addMessage('ai', "Here is your generated image:", data.data[0].url, true);
            } catch (e) {
                document.getElementById(loaderId).innerText = "Image Generation Failed.";
            }
        }

        function addMessage(role, text, img = null, isGen = false) {
            const chatBox = document.getElementById('chat-box');
            const div = document.createElement('div');
            div.className = `flex ${role === 'user' ? 'justify-end' : 'justify-start'} mb-6`;
            div.innerHTML = `
                <div class="max-w-[80%] ${role === 'user' ? 'bg-cyan-600/20' : 'glass'} p-4 rounded-2xl border border-white/10">
                    ${img ? `<img src="${img}" class="rounded-lg mb-2 max-h-60 w-full object-cover">` : ''}
                    <p class="text-sm">${text}</p>
                    ${isGen ? `<a href="${img}" target="_blank" class="block mt-2 text-xs text-cyan-400 underline">Download HD Image</a>` : ''}
                </div>
            `;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
            lucide.createIcons();
        }
    </script>
</body>
</html>
