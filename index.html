<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>UMAIR AI STUDIO</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');

        :root {
            --primary: #00e5ff;
            --primary-glow: rgba(0, 229, 255, 0.5);
            --bg-dark: #070b14;
            --card-bg: rgba(255, 255, 255, 0.04);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            background: radial-gradient(circle at top center, #131c2f, var(--bg-dark));
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* --- Loading Screen --- */
        #loader {
            position: fixed;
            inset: 0;
            background: var(--bg-dark);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.6s ease-out, visibility 0.6s ease-out;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(0, 229, 255, 0.1);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite, glow 2s ease-in-out infinite alternate;
            margin-bottom: 20px;
        }

        #loader h2 {
            font-size: 24px;
            letter-spacing: 3px;
            color: var(--primary);
            text-transform: uppercase;
            border: none;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes glow { from { box-shadow: 0 0 10px var(--primary-glow); } to { box-shadow: 0 0 30px var(--primary-glow); } }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary); }

        /* Header */
        header {
            padding: 20px;
            text-align: center;
            font-size: 28px;
            font-weight: 800;
            background: rgba(7, 11, 20, 0.7);
            border-bottom: 1px solid var(--card-border);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(12px);
            letter-spacing: 2px;
            text-transform: uppercase;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header span {
            color: var(--primary);
            text-shadow: 0 0 20px var(--primary-glow);
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 30px 20px;
            flex: 1;
            width: 100%;
            display: flex;
            flex-direction: column;
        }

        /* Navigation */
        .nav {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .nav button {
            padding: 12px 30px;
            border: 1px solid var(--card-border);
            border-radius: 30px;
            background: rgba(255,255,255,0.03);
            color: var(--text-muted);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(8px);
        }

        .nav button:hover, .nav button.active {
            background: var(--primary);
            color: #000;
            border-color: var(--primary);
            box-shadow: 0 0 20px var(--primary-glow);
            transform: scale(1.05);
        }

        /* Card Layouts */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 25px;
            border-radius: 24px;
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            animation: slideUp 0.5s ease-out;
            display: none;
            flex: 1;
            flex-direction: column;
        }

        .card.active {
            display: flex;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h2 {
            margin-bottom: 20px;
            color: var(--text-main);
            font-size: 20px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 15px;
        }

        h2 i { color: var(--primary); }

        /* Inputs & Buttons */
        .input-group { margin-bottom: 20px; }
        
        .input-group label {
            display: block;
            margin-bottom: 10px;
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 600;
        }

        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 16px 20px;
            border: 1px solid var(--card-border);
            outline: none;
            border-radius: 16px;
            background: rgba(0, 0, 0, 0.3);
            color: white;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.2);
            background: rgba(0, 0, 0, 0.5);
        }

        .action-btn {
            padding: 16px 30px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, var(--primary), #0099ff);
            color: #000;
            font-weight: 800;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .action-btn:hover {
            box-shadow: 0 0 25px var(--primary-glow);
            transform: translateY(-2px);
        }

        /* Chat Section */
        .chat-box {
            flex: 1;
            min-height: 400px;
            max-height: 550px;
            overflow-y: auto;
            padding: 10px 5px 20px 5px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scroll-behavior: smooth;
        }

        .message {
            max-width: 85%;
            padding: 16px 22px;
            border-radius: 20px;
            line-height: 1.6;
            font-size: 15px;
            word-wrap: break-word;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            animation: fadeInMsg 0.3s ease-out;
        }

        @keyframes fadeInMsg { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

        .message.user {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .message.ai {
            background: rgba(30, 41, 59, 0.7);
            color: var(--text-main);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border: 1px solid var(--card-border);
            backdrop-filter: blur(10px);
        }

        /* Styling for AI Markdown */
        .message.ai p { margin-bottom: 10px; }
        .message.ai p:last-child { margin-bottom: 0; }
        .message.ai pre {
            background: #0f172a;
            padding: 15px;
            border-radius: 12px;
            overflow-x: auto;
            margin: 10px 0;
            border: 1px solid #334155;
        }
        .message.ai code {
            font-family: 'Courier New', Courier, monospace;
            color: var(--primary);
            background: rgba(0,0,0,0.3);
            padding: 2px 6px;
            border-radius: 4px;
        }
        .message.ai pre code { background: none; padding: 0; }

        .chat-input-wrapper {
            display: flex;
            gap: 12px;
            margin-top: 15px;
            background: rgba(0,0,0,0.2);
            padding: 10px;
            border-radius: 20px;
            border: 1px solid var(--card-border);
        }

        .chat-input-wrapper input {
            flex: 1;
            background: transparent;
            border: none;
            box-shadow: none;
            padding: 10px 15px;
        }
        
        .chat-input-wrapper input:focus {
            background: transparent;
            box-shadow: none;
        }

        .chat-input-wrapper .action-btn {
            width: auto;
            padding: 0 25px;
            border-radius: 12px;
        }

        /* Typing Indicator */
        .typing {
            display: flex;
            gap: 6px;
            padding: 15px 20px;
            align-items: center;
            align-self: flex-start;
            background: rgba(30, 41, 59, 0.5);
            border-radius: 20px;
            border-bottom-left-radius: 4px;
            border: 1px solid var(--card-border);
        }
        .dot {
            width: 8px; height: 8px;
            background: var(--primary);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }
        
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); opacity: 0.5; }
            40% { transform: scale(1); opacity: 1; box-shadow: 0 0 10px var(--primary); }
        }

        .model-badge {
            display: inline-block;
            background: rgba(0, 229, 255, 0.1);
            color: var(--primary);
            padding: 8px 15px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            border: 1px solid rgba(0, 229, 255, 0.3);
            margin-bottom: 20px;
        }

    </style>
</head>
<body>

<div id="loader">
    <div class="spinner"></div>
    <h2>Starting Studio...</h2>
</div>

<header>UMAIR AI <span>STUDIO</span></header>

<div class="container">

    <div class="nav">
        <button class="active" onclick="switchTab('chat', this)"><i class="fa-solid fa-bolt"></i> Fast Chat</button>
        <button onclick="switchTab('settings', this)"><i class="fa-solid fa-gear"></i> Settings</button>
    </div>

    <div class="card active" id="chat">
        <h2><i class="fa-solid fa-microchip"></i> AI Assistant</h2>
        
        <div class="chat-box" id="chatBox">
            <div class="message ai">Hello Sir, I am powered by <strong>GPT-3.5 Turbo</strong>. I am fully optimized and ready to assist you quickly. How can I help you today?</div>
        </div>
        
        <div class="chat-input-wrapper">
            <input type="text" id="chatInput" placeholder="Type your message here..." onkeypress="handleEnter(event)" autocomplete="off" />
            <button class="action-btn" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>

    <div class="card" id="settings">
        <h2><i class="fa-solid fa-sliders"></i> System Configuration</h2>
        
        <div class="model-badge">
            <i class="fa-solid fa-rocket"></i> Active Model: GPT-3.5 Turbo (Fast)
        </div>

        <div class="input-group">
            <label>OpenRouter API Key</label>
            <input type="password" id="apiKey" placeholder="Paste your sk-or-v1-... key here" />
        </div>

        <button class="action-btn" onclick="saveSettings()"><i class="fa-solid fa-floppy-disk"></i> Save Key</button>
        <p id="saveMsg" style="color: #10b981; margin-top: 20px; font-weight: 600; font-size: 14px; display: none; text-align: center;">
            <i class="fa-solid fa-check-circle"></i> API Key Saved Successfully.
        </p>
    </div>

</div>

<script>
    // --- Loading Screen Logic ---
    window.addEventListener('load', () => {
        setTimeout(() => {
            const loader = document.getElementById('loader');
            loader.style.opacity = '0';
            loader.style.visibility = 'hidden';
        }, 1200); // 1.2 seconds of smooth loading screen
    });

    // --- System Initialization ---
    let OPENROUTER_API = localStorage.getItem("openrouter_api") || "";
    // Hardcoded to fast model as requested
    const SELECTED_MODEL = "openai/gpt-3.5-turbo"; 

    window.onload = () => {
        if(OPENROUTER_API) document.getElementById("apiKey").value = OPENROUTER_API;
    };

    // --- Tab Switching Logic ---
    function switchTab(tabId, btnElement) {
        document.querySelectorAll('.card').forEach(card => card.classList.remove('active'));
        document.querySelectorAll('.nav button').forEach(btn => btn.classList.remove('active'));
        
        document.getElementById(tabId).classList.add('active');
        btnElement.classList.add('active');
    }

    // --- Save Settings ---
    function saveSettings() {
        OPENROUTER_API = document.getElementById("apiKey").value.trim();
        localStorage.setItem("openrouter_api", OPENROUTER_API);
        
        const msg = document.getElementById("saveMsg");
        msg.style.display = "block";
        setTimeout(() => msg.style.display = "none", 3000);
    }

    // --- Handle Enter Key ---
    function handleEnter(e) {
        if (e.key === 'Enter') sendMessage();
    }

    // --- Core Chat Logic ---
    async function sendMessage() {
        if (!OPENROUTER_API) {
            alert("Sir, please save your OpenRouter API key in the Settings tab first.");
            return;
        }

        const input = document.getElementById("chatInput");
        const chatBox = document.getElementById("chatBox");
        const userText = input.value.trim();

        if (!userText) return;

        // Display User Message
        chatBox.innerHTML += `<div class="message user">${userText}</div>`;
        input.value = "";
        
        // Scroll to bottom immediately
        chatBox.scrollTop = chatBox.scrollHeight;

        // Add Typing Indicator
        const typingId = 'typing-' + Date.now();
        chatBox.innerHTML += `
            <div class="typing" id="${typingId}">
                <div class="dot"></div><div class="dot"></div><div class="dot"></div>
            </div>`;
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Authorization": "Bearer " + OPENROUTER_API,
                    "HTTP-Referer": window.location.href,
                    "X-Title": "Umair AI Studio Fast",
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    model: SELECTED_MODEL,
                    messages: [
                        { role: "system", content: "You are Umair AI Studio's fast and helpful assistant. Format text beautifully." },
                        { role: "user", content: userText }
                    ]
                })
            });

            const data = await response.json();
            
            // Remove typing indicator
            const typingElement = document.getElementById(typingId);
            if(typingElement) typingElement.remove();

            if (data.error) {
                chatBox.innerHTML += `<div class="message ai" style="color:#ef4444; border-color:#ef4444;"><i class="fa-solid fa-triangle-exclamation"></i> Error: ${data.error.message}</div>`;
            } else {
                const aiReplyRaw = data.choices?.[0]?.message?.content || "No response.";
                // Convert Markdown to smooth HTML
                const formattedReply = marked.parse(aiReplyRaw); 
                chatBox.innerHTML += `<div class="message ai">${formattedReply}</div>`;
            }
        } catch (err) {
            const typingElement = document.getElementById(typingId);
            if(typingElement) typingElement.remove();
            
            chatBox.innerHTML += `<div class="message ai" style="color:#ef4444; border-color:#ef4444;"><i class="fa-solid fa-wifi"></i> Network Error. Please check your internet or API key.</div>`;
        }
        
        // Final scroll to bottom
        chatBox.scrollTop = chatBox.scrollHeight;
    }
</script>

</body>
    </html>
