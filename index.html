<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UMAIR AI STUDIO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Space+Grotesk:wght@500;700&display=swap');
        
        :root {
            --neon-blue: #00d2ff;
            --neon-purple: #9d50bb;
        }

        body {
            background: radial-gradient(circle at center, #1a1a2e 0%, #0f0f1a 100%);
            color: white;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
        }

        .neon-border:focus {
            border-color: var(--neon-blue);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.3);
        }

        .glow-text {
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.5);
            font-family: 'Space Grotesk', sans-serif;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 5px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 10px;
        }

        .typing-dot {
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }

        #splash-screen {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.8s ease-out;
        }
    </style>
</head>
<body>

    <!-- Splash Screen -->
    <div id="splash-screen">
        <div class="relative">
            <div class="absolute -inset-4 bg-gradient-to-r from-cyan-500 to-purple-600 rounded-full blur opacity-50 animate-pulse"></div>
            <h1 class="relative text-4xl font-bold glow-text tracking-tighter">UMAIR AI STUDIO</h1>
        </div>
        <div class="mt-8 w-48 h-1 bg-gray-800 rounded-full overflow-hidden">
            <div class="h-full bg-cyan-400 animate-[progress_2s_ease-in-out]"></div>
        </div>
    </div>

    <div class="flex h-screen overflow-hidden opacity-0 transition-opacity duration-1000" id="main-app">
        
        <!-- Sidebar -->
        <aside id="sidebar" class="w-72 glass border-r border-white/10 flex-col hidden md:flex transition-all duration-300">
            <div class="p-6">
                <div class="flex items-center gap-3 mb-8">
                    <div class="w-8 h-8 bg-gradient-to-br from-cyan-400 to-purple-500 rounded-lg"></div>
                    <span class="font-bold text-lg glow-text uppercase tracking-widest text-xs">Umair Studio</span>
                </div>
                
                <button onclick="createNewChat()" class="w-full py-3 px-4 rounded-xl bg-white/5 border border-white/10 hover:bg-white/10 transition-all flex items-center gap-3 text-sm">
                    <i data-lucide="plus" class="w-4 h-4"></i> New Chat
                </button>
            </div>

            <div class="flex-1 overflow-y-auto px-4 custom-scrollbar" id="chat-history">
                <!-- History Items -->
            </div>

            <div class="p-4 border-t border-white/10">
                <button onclick="promptSettings()" class="flex items-center gap-3 p-3 w-full hover:bg-white/5 rounded-lg transition-colors text-gray-400 hover:text-white">
                    <i data-lucide="settings" class="w-5 h-5"></i>
                    <span>Admin Settings</span>
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col relative">
            
            <!-- Header -->
            <header class="h-16 border-b border-white/10 flex items-center justify-between px-6 glass z-10">
                <div class="flex items-center gap-4">
                    <button class="md:hidden"><i data-lucide="menu"></i></button>
                    <h2 id="current-chat-title" class="text-sm font-medium text-gray-300 uppercase tracking-widest">Global Assistant</h2>
                </div>
                <div class="flex items-center gap-4">
                    <select id="model-select" class="bg-transparent text-xs border border-white/20 rounded-full px-3 py-1 outline-none">
                        <option value="gpt-4o">GPT-4o</option>
                        <option value="gemini-pro">Gemini Pro 1.5</option>
                        <option value="claude-3">Claude 3.5 Sonnet</option>
                    </select>
                </div>
            </header>

            <!-- Chat Area -->
            <div id="chat-window" class="flex-1 overflow-y-auto p-4 md:p-8 space-y-6 custom-scrollbar">
                <!-- Welcome State -->
                <div id="empty-state" class="h-full flex flex-col items-center justify-center text-center opacity-60">
                    <div class="w-20 h-20 mb-6 rounded-3xl bg-gradient-to-tr from-cyan-500/20 to-purple-500/20 flex items-center justify-center border border-white/10">
                        <i data-lucide="sparkles" class="w-10 h-10 text-cyan-400"></i>
                    </div>
                    <h3 class="text-2xl font-bold mb-2">Welcome to Umair AI Studio</h3>
                    <p class="max-w-md text-gray-400">The next generation of creative intelligence. Start a conversation or generate art.</p>
                </div>
                
                <div id="messages-container" class="max-w-4xl mx-auto space-y-8"></div>
            </div>

            <!-- Input Area -->
            <footer class="p-4 md:p-8 bg-gradient-to-t from-[#0f0f1a] to-transparent">
                <div class="max-w-4xl mx-auto relative">
                    <div class="glass rounded-2xl p-2 flex flex-col gap-2 border-white/20">
                        <!-- Image Preview Slot -->
                        <div id="image-preview-container" class="hidden px-4 pt-2">
                            <div class="relative w-20 h-20 group">
                                <img id="image-preview" src="" class="w-full h-full object-cover rounded-lg border border-cyan-500/50">
                                <button onclick="removeImage()" class="absolute -top-2 -right-2 bg-red-500 rounded-full p-1 opacity-0 group-hover:opacity-100 transition-opacity">
                                    <i data-lucide="x" class="w-3 h-3"></i>
                                </button>
                            </div>
                        </div>

                        <div class="flex items-end gap-2">
                            <button onclick="document.getElementById('file-input').click()" class="p-3 text-gray-400 hover:text-cyan-400 transition-colors">
                                <i data-lucide="paperclip" class="w-5 h-5"></i>
                            </button>
                            <input type="file" id="file-input" class="hidden" accept="image/*" onchange="handleFileUpload(event)">
                            
                            <textarea id="user-input" rows="1" placeholder="Type a message or 'generate a cyberpunk city'..." class="w-full bg-transparent border-none outline-none resize-none py-3 px-2 text-white placeholder-gray-500 custom-scrollbar" oninput="autoResize(this)"></textarea>
                            
                            <button onclick="handleSend()" class="p-3 bg-cyan-500 hover:bg-cyan-400 text-black rounded-xl transition-all shadow-[0_0_15px_rgba(6,182,212,0.4)]">
                                <i data-lucide="send" class="w-5 h-5"></i>
                            </button>
                        </div>
                    </div>
                    <p class="text-[10px] text-center mt-3 text-gray-500 uppercase tracking-widest">Umair AI Studio • Advanced Neural Engine v3.0</p>
                </div>
            </footer>
        </main>

        <!-- Settings Modal (Password Protected) -->
        <div id="settings-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
            <div class="glass max-w-md w-full rounded-3xl p-8 border-cyan-500/30">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-xl font-bold glow-text">ADMIN SETTINGS</h2>
                    <button onclick="closeSettings()"><i data-lucide="x"></i></button>
                </div>
                
                <div class="space-y-4">
                    <div>
                        <label class="text-xs text-gray-400 uppercase mb-2 block">Provider</label>
                        <select class="w-full bg-white/5 border border-white/10 rounded-lg p-3 outline-none">
                            <option>OpenAI</option>
                            <option>Anthropic</option>
                            <option>Google Gemini</option>
                            <option>OpenRouter</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-xs text-gray-400 uppercase mb-2 block">API Key</label>
                        <input type="password" placeholder="sk-••••••••••••" class="w-full bg-white/5 border border-white/10 rounded-lg p-3 outline-none neon-border transition-all">
                    </div>
                    <div class="flex items-center justify-between p-3 bg-white/5 rounded-lg">
                        <span class="text-sm">Image Generation (DALL-E 3)</span>
                        <div class="w-10 h-5 bg-cyan-600 rounded-full relative cursor-pointer">
                            <div class="absolute right-1 top-1 w-3 h-3 bg-white rounded-full"></div>
                        </div>
                    </div>
                    <button onclick="saveSettings()" class="w-full py-4 bg-gradient-to-r from-cyan-600 to-purple-600 rounded-xl font-bold mt-4 hover:brightness-110 transition-all">
                        SAVE CONFIGURATION
                    </button>
                </div>
            </div>
        </div>

    </div>

    <script>
        // --- Initialization ---
        lucide.createIcons();
        
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('splash-screen').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('splash-screen').style.display = 'none';
                    document.getElementById('main-app').classList.remove('opacity-0');
                }, 800);
            }, 2000);
            renderHistory();
        });

        // --- State Management ---
        let chats = JSON.parse(localStorage.getItem('umair_chats')) || [];
        let currentImage = null;

        // --- Core Functions ---
        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = textarea.scrollHeight + 'px';
        }

        function promptSettings() {
            const pass = prompt("Enter Admin Password:");
            if (pass === "121845") {
                document.getElementById('settings-modal').classList.remove('hidden');
            } else {
                alert("Unauthorized access.");
            }
        }

        function closeSettings() {
            document.getElementById('settings-modal').classList.add('hidden');
        }

        function handleFileUpload(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    currentImage = event.target.result;
                    document.getElementById('image-preview').src = currentImage;
                    document.getElementById('image-preview-container').classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        }

        function removeImage() {
            currentImage = null;
            document.getElementById('image-preview-container').classList.add('hidden');
        }

        async function handleSend() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            
            if (!text && !currentImage) return;

            // Hide empty state
            document.getElementById('empty-state').classList.add('hidden');

            // Add User Message
            addMessage('user', text, currentImage);
            input.value = '';
            input.style.height = 'auto';
            const tempImg = currentImage;
            removeImage();

            // Mock AI Response (Connecting to logic)
            showTypingIndicator();
            
            setTimeout(() => {
                removeTypingIndicator();
                if (text.toLowerCase().includes('generate')) {
                    addMessage('ai', "I've generated this image based on your prompt:", "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=800&q=80", true);
                } else {
                    addMessage('ai', "This is a response from **Umair AI Studio**. I am currently in demo mode. Please configure your API key in settings to enable live neural processing.");
                }
                saveChatToLocal();
            }, 1500);
        }

        function addMessage(role, text, img = null, isGenerated = false) {
            const container = document.getElementById('messages-container');
            const msgDiv = document.createElement('div');
            msgDiv.className = `flex ${role === 'user' ? 'justify-end' : 'justify-start'} animate-in fade-in slide-in-from-bottom-4 duration-500`;
            
            const innerContent = `
                <div class="max-w-[85%] ${role === 'user' ? 'bg-cyan-600/20 border border-cyan-500/30' : 'glass'} rounded-2xl p-4">
                    ${img ? `<img src="${img}" class="rounded-lg mb-3 max-h-64 object-cover border border-white/10">` : ''}
                    <p class="text-sm leading-relaxed text-gray-200">${text}</p>
                    ${isGenerated ? `<button class="mt-3 text-xs flex items-center gap-1 text-cyan-400 hover:underline"><i data-lucide="download" class="w-3 h-3"></i> Download</button>` : ''}
                    <div class="mt-2 flex justify-end">
                        <button onclick="copyText(this)" class="text-gray-500 hover:text-white transition-colors"><i data-lucide="copy" class="w-3 h-3"></i></button>
                    </div>
                </div>
            `;
            
            msgDiv.innerHTML = innerContent;
            container.appendChild(msgDiv);
            document.getElementById('chat-window').scrollTo({ top: document.getElementById('chat-window').scrollHeight, behavior: 'smooth' });
            lucide.createIcons();
        }

        function showTypingIndicator() {
            const container = document.getElementById('messages-container');
            const tid = document.createElement('div');
            tid.id = 'typing-indicator';
            tid.className = 'flex gap-2 p-4 glass rounded-2xl w-16';
            tid.innerHTML = `
                <div class="typing-dot w-1.5 h-1.5 bg-cyan-400 rounded-full"></div>
                <div class="typing-dot w-1.5 h-1.5 bg-cyan-400 rounded-full"></div>
                <div class="typing-dot w-1.5 h-1.5 bg-cyan-400 rounded-full"></div>
            `;
            container.appendChild(tid);
        }

        function removeTypingIndicator() {
            const el = document.getElementById('typing-indicator');
            if (el) el.remove();
        }

        function createNewChat() {
            document.getElementById('messages-container').innerHTML = '';
            document.getElementById('empty-state').classList.remove('hidden');
        }

        function saveChatToLocal() {
            // Implementation for persistence
            const history = document.getElementById('chat-history');
            const title = "New Conversation " + (chats.length + 1);
            chats.push(title);
            localStorage.setItem('umair_chats', JSON.stringify(chats));
            renderHistory();
        }

        function renderHistory() {
            const history = document.getElementById('chat-history');
            history.innerHTML = chats.map((chat, i) => `
                <div class="group flex items-center justify-between p-3 mb-2 rounded-lg hover:bg-white/5 cursor-pointer text-sm text-gray-400 transition-all">
                    <div class="flex items-center gap-3 overflow-hidden">
                        <i data-lucide="message-square" class="w-4 h-4 flex-shrink-0"></i>
                        <span class="truncate">${chat}</span>
                    </div>
                    <button onclick="deleteChat(${i})" class="opacity-0 group-hover:opacity-100 p-1 hover:text-red-400">
                        <i data-lucide="trash-2" class="w-3 h-3"></i>
                    </button>
                </div>
            `).join('');
            lucide.createIcons();
        }

        function deleteChat(index) {
            chats.splice(index, 1);
            localStorage.setItem('umair_chats', JSON.stringify(chats));
            renderHistory();
        }

        function copyText(btn) {
            const text = btn.closest('div').parentElement.querySelector('p').innerText;
            navigator.clipboard.writeText(text);
            btn.innerHTML = '<i data-lucide="check" class="w-3 h-3 text-green-400"></i>';
            lucide.createIcons();
            setTimeout(() => {
                btn.innerHTML = '<i data-lucide="copy" class="w-3 h-3"></i>';
                lucide.createIcons();
            }, 2000);
        }

        function saveSettings() {
            alert("Configuration Encrypted & Saved Successfully.");
            closeSettings();
        }
    </script>
</body>
</html>
