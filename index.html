<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Mario Voxel Clone</title>
<style>
  body { margin: 0; overflow: hidden; font-family: sans-serif; }
  canvas { display: block; }
  #hud {
    position: absolute; top: 10px; left: 10px;
    color: white; background: rgba(0,0,0,0.5);
    padding: 8px 12px; border-radius: 6px;
    font-size: 14px; user-select: none;
  }
  #crosshair {
    position: absolute; top: 50%; left: 50%;
    width: 4px; height: 4px; background: white;
    border-radius: 50%; transform: translate(-50%, -50%);
    pointer-events: none;
  }
  #hotbar {
    position: absolute; bottom: 20px; left: 50%;
    transform: translateX(-50%);
    display: flex; gap: 4px;
  }
  .slot {
    width: 50px; height: 50px;
    border: 2px solid #555; background: rgba(0,0,0,0.5);
    color: white; display: flex; align-items: center; justify-content: center;
    font-size: 12px; text-align: center;
  }
  .slot.active { border-color: white; }
  #info {
    position: absolute; bottom: 80px; left: 50%;
    transform: translateX(-50%);
    color: white; background: rgba(0,0,0,0.5);
    padding: 6px 12px; border-radius: 6px;
    font-size: 12px; text-align: center;
  }
</style>
</head>
<body>
<div id="hud">
  <div>Mario Voxel World</div>
  <div id="pos">Pos: 0,0,0</div>
</div>
<div id="crosshair"></div>
<div id="info">WASD: Move | Space: Jump | Mouse: Look | Left Click: Break | Right Click: Place | 1-5: Select Block</div>
<div id="hotbar"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

// === Scene Setup ===
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 40, 100);

const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 500);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// === Lighting ===
const sun = new THREE.DirectionalLight(0xffffff, 1);
sun.position.set(50, 100, 50);
scene.add(sun);
scene.add(new THREE.AmbientLight(0xffffff, 0.5));

// === Procedural Textures ===
function makeTexture(drawFn) {
  const c = document.createElement('canvas');
  c.width = c.height = 32;
  const ctx = c.getContext('2d');
  drawFn(ctx);
  const tex = new THREE.CanvasTexture(c);
  tex.magFilter = THREE.NearestFilter;
  tex.minFilter = THREE.NearestFilter;
  return tex;
}

function noise(ctx, baseColor, variance) {
  for (let y = 0; y < 32; y++) {
    for (let x = 0; x < 32; x++) {
      const v = (Math.random() - 0.5) * variance;
      const r = Math.max(0, Math.min(255, baseColor[0] + v));
      const g = Math.max(0, Math.min(255, baseColor[1] + v));
      const b = Math.max(0, Math.min(255, baseColor[2] + v));
      ctx.fillStyle = `rgb(${r|0},${g|0},${b|0})`;
      ctx.fillRect(x, y, 1, 1);
    }
  }
}

const textures = {
  grass: makeTexture(ctx => {
    noise(ctx, [120, 80, 40], 30); // dirt base
    // grass top strip
    for (let y = 0; y < 6; y++)
      for (let x = 0; x < 32; x++) {
        const v = (Math.random() - 0.5) * 40;
        ctx.fillStyle = `rgb(${60+v|0},${150+v|0},${50+v|0})`;
        ctx.fillRect(x, y, 1, 1);
      }
  }),
  grassTop: makeTexture(ctx => noise(ctx, [80, 170, 60], 40)),
  dirt: makeTexture(ctx => noise(ctx, [120, 80, 40], 30)),
  stone: makeTexture(ctx => noise(ctx, [130, 130, 130], 40)),
  brick: makeTexture(ctx => {
    ctx.fillStyle = '#a0421b'; ctx.fillRect(0, 0, 32, 32);
    ctx.strokeStyle = '#000'; ctx.lineWidth = 1;
    for (let y = 0; y < 32; y += 8) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(32, y); ctx.stroke();
      const off = (y/8) % 2 ? 8 : 0;
      for (let x = off; x <= 32; x += 16) {
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y+8); ctx.stroke();
      }
    }
  }),
  questionBlock: makeTexture(ctx => {
    ctx.fillStyle = '#e8a13a'; ctx.fillRect(0, 0, 32, 32);
    ctx.strokeStyle = '#5a3000'; ctx.lineWidth = 2;
    ctx.strokeRect(1, 1, 30, 30);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 22px sans-serif';
    ctx.textAlign = 'center'; ctx.fillText('?', 16, 24);
  }),
  wood: makeTexture(ctx => {
    ctx.fillStyle = '#6b4423'; ctx.fillRect(0, 0, 32, 32);
    ctx.strokeStyle = '#3e2410';
    for (let i = 0; i < 8; i++) {
      ctx.beginPath();
      ctx.moveTo(0, i*4 + Math.random()*2);
      ctx.lineTo(32, i*4 + Math.random()*2);
      ctx.stroke();
    }
  }),
  leaves: makeTexture(ctx => noise(ctx, [40, 130, 40], 50)),
};

// === Block Types ===
const BLOCKS = {
  grass: { name: 'Grass', mat: [
    new THREE.MeshLambertMaterial({ map: textures.grass }),       // +x
    new THREE.MeshLambertMaterial({ map: textures.grass }),       // -x
    new THREE.MeshLambertMaterial({ map: textures.grassTop }),    // +y
    new THREE.MeshLambertMaterial({ map: textures.dirt }),        // -y
    new THREE.MeshLambertMaterial({ map: textures.grass }),       // +z
    new THREE.MeshLambertMaterial({ map: textures.grass }),       // -z
  ]},
  dirt: { name: 'Dirt', mat: new THREE.MeshLambertMaterial({ map: textures.dirt }) },
  stone: { name: 'Stone', mat: new THREE.MeshLambertMaterial({ map: textures.stone }) },
  brick: { name: 'Brick', mat: new THREE.MeshLambertMaterial({ map: textures.brick }) },
  question: { name: '?Block', mat: new THREE.MeshLambertMaterial({ map: textures.questionBlock }) },
  wood: { name: 'Wood', mat: new THREE.MeshLambertMaterial({ map: textures.wood }) },
  leaves: { name: 'Leaves', mat: new THREE.MeshLambertMaterial({ map: textures.leaves, transparent: true, opacity: 0.95 }) },
};

const placeableTypes = ['grass', 'dirt', 'stone', 'brick', 'question'];

// === World ===
const world = new Map(); // key "x,y,z" -> {type, mesh}
const geo = new THREE.BoxGeometry(1, 1, 1);

function key(x, y, z) { return `${x},${y},${z}`; }

function addBlock(x, y, z, type) {
  const k = key(x, y, z);
  if (world.has(k)) return;
  const mat = BLOCKS[type].mat;
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(x, y, z);
  mesh.userData = { x, y, z, type };
  scene.add(mesh);
  world.set(k, { type, mesh });
}

function removeBlock(x, y, z) {
  const k = key(x, y, z);
  const b = world.get(k);
  if (!b) return;
  scene.remove(b.mesh);
  world.delete(k);
}

// === World Generation ===
// Simple value-noise-ish heightmap using sine combinations
function heightAt(x, z) {
  const h = Math.sin(x * 0.15) * 1.5 + Math.cos(z * 0.18) * 1.5
          + Math.sin((x + z) * 0.08) * 2;
  return Math.floor(h + 4);
}

function generateTree(x, y, z) {
  const trunkH = 3 + Math.floor(Math.random() * 2);
  for (let i = 0; i < trunkH; i++) addBlock(x, y + i, z, 'wood');
  const top = y + trunkH;
  for (let dx = -2; dx <= 2; dx++)
    for (let dz = -2; dz <= 2; dz++)
      for (let dy = 0; dy <= 2; dy++) {
        const dist = Math.abs(dx) + Math.abs(dz) + dy;
        if (dist <= 3 && !(dx === 0 && dz === 0 && dy < 2))
          addBlock(x + dx, top + dy, z + dz, 'leaves');
      }
}

const WORLD_SIZE = 24;
function generateWorld() {
  for (let x = -WORLD_SIZE; x <= WORLD_SIZE; x++) {
    for (let z = -WORLD_SIZE; z <= WORLD_SIZE; z++) {
      const h = heightAt(x, z);
      addBlock(x, h, z, 'grass');
      for (let y = h - 1; y >= h - 3; y--) addBlock(x, y, z, 'dirt');
      for (let y = h - 4; y >= -2; y--) addBlock(x, y, z, 'stone');
    }
  }
  // trees
  for (let i = 0; i < 18; i++) {
    const x = Math.floor((Math.random() - 0.5) * WORLD_SIZE * 1.6);
    const z = Math.floor((Math.random() - 0.5) * WORLD_SIZE * 1.6);
    const h = heightAt(x, z);
    generateTree(x, h + 1, z);
  }
  // a few floating brick / question blocks (Mario style)
  for (let i = 0; i < 6; i++) {
    const x = Math.floor((Math.random() - 0.5) * 20);
    const z = Math.floor((Math.random() - 0.5) * 20);
    const h = heightAt(x, z) + 4;
    addBlock(x, h, z, 'brick');
    addBlock(x + 1, h, z, 'question');
    addBlock(x + 2, h, z, 'brick');
  }
}
generateWorld();

// === Player / Controls ===
const controls = new PointerLockControls(camera, document.body);
scene.add(controls.getObject());
controls.getObject().position.set(0, 15, 0);

document.body.addEventListener('click', () => controls.lock());

const velocity = new THREE.Vector3();
const keys = {};
let onGround = false;

addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code.startsWith('Digit')) {
    const n = parseInt(e.code.slice(5)) - 1;
    if (n >= 0 && n < placeableTypes.length) selectSlot(n);
  }
});
addEventListener('keyup', e => keys[e.code] = false);

// === Hotbar ===
let activeSlot = 0;
const hotbar = document.getElementById('hotbar');
placeableTypes.forEach((t, i) => {
  const div = document.createElement('div');
  div.className = 'slot' + (i === 0 ? ' active' : '');
  div.textContent = `${i+1}\n${BLOCKS[t].name}`;
  div.style.whiteSpace = 'pre';
  hotbar.appendChild(div);
});
function selectSlot(n) {
  activeSlot = n;
  [...hotbar.children].forEach((c, i) => c.classList.toggle('active', i === n));
}

// === Raycasting (break/place) ===
const raycaster = new THREE.Raycaster();
raycaster.far = 6;

addEventListener('mousedown', e => {
  if (!controls.isLocked) return;
  raycaster.setFromCamera({ x: 0, y: 0 }, camera);
  const meshes = [...world.values()].map(b => b.mesh);
  const hits = raycaster.intersectObjects(meshes);
  if (!hits.length) return;
  const hit = hits[0];
  const { x, y, z } = hit.object.userData;
  if (e.button === 0) {
    removeBlock(x, y, z);
  } else if (e.button === 2) {
    const n = hit.face.normal;
    const nx = x + n.x, ny = y + n.y, nz = z + n.z;
    // don't place inside player
    const px = controls.getObject().position;
    const dx = nx - px.x, dy = ny - px.y, dz = nz - px.z;
    if (Math.abs(dx) < 0.9 && dy > -2 && dy < 1 && Math.abs(dz) < 0.9) return;
    addBlock(nx, ny, nz, placeableTypes[activeSlot]);
  }
});
addEventListener('contextmenu', e => e.preventDefault());

// === Physics / Collision ===
const playerSize = { w: 0.6, h: 1.7 };

function blockAt(x, y, z) {
  return world.has(key(Math.floor(x), Math.floor(y), Math.floor(z)));
}

function collides(px, py, pz) {
  const half = playerSize.w / 2;
  for (let x = px - half; x <= px + half; x += playerSize.w)
    for (let z = pz - half; z <= pz + half; z += playerSize.w)
      for (let y = py - playerSize.h; y <= py; y += 0.5)
        if (blockAt(x, y, z)) return true;
  return false;
}

function updatePhysics(dt) {
  const obj = controls.getObject();
  const speed = 5;
  const forward = new THREE.Vector3();
  camera.getWorldDirection(forward);
  forward.y = 0; forward.normalize();
  const right = new THREE.Vector3().crossVectors(forward, new THREE.Vector3(0,1,0)).negate();

  const move = new THREE.Vector3();
  if (keys['KeyW']) move.add(forward);
  if (keys['KeyS']) move.sub(forward);
  if (keys['KeyA']) move.sub(right);
  if (keys['KeyD']) move.add(right);
  if (move.lengthSq() > 0) move.normalize().multiplyScalar(speed);

  velocity.x = move.x;
  velocity.z = move.z;
  velocity.y -= 20 * dt; // gravity

  if (keys['Space'] && onGround) { velocity.y = 8.5; onGround = false; }

  // X axis
  let nx = obj.position.x + velocity.x * dt;
  if (!collides(nx, obj.position.y, obj.position.z)) obj.position.x = nx;
  // Z axis
  let nz = obj.position.z + velocity.z * dt;
  if (!collides(obj.position.x, obj.position.y, nz)) obj.position.z = nz;
  // Y axis
  let ny = obj.position.y + velocity.y * dt;
  if (!collides(obj.position.x, ny, obj.position.z)) {
    obj.position.y = ny;
    onGround = false;
  } else {
    if (velocity.y < 0) onGround = true;
    velocity.y = 0;
  }

  // fall safety
  if (obj.position.y < -20) {
    obj.position.set(0, 15, 0);
    velocity.set(0,0,0);
  }
}

// === Main Loop ===
const clock = new THREE.Clock();
const posEl = document.getElementById('pos');

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.1);
  if (controls.isLocked) updatePhysics(dt);
  const p = controls.getObject().position;
  posEl.textContent = `Pos: ${p.x.toFixed(1)}, ${p.y.toFixed(1)}, ${p.z.toFixed(1)}`;
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
