```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Umair AI Studio</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#050816;
      overflow:hidden;
      color:white;
    }

    .bg{
      position:fixed;
      width:100%;
      height:100%;
      background:
      radial-gradient(circle at top left,#1e3a8a33,transparent 40%),
      radial-gradient(circle at bottom right,#7c3aed33,transparent 40%),
      #050816;
      z-index:-2;
    }

    .particles{
      position:fixed;
      width:100%;
      height:100%;
      overflow:hidden;
      z-index:-1;
    }

    .particle{
      position:absolute;
      width:4px;
      height:4px;
      background:#38bdf8;
      border-radius:50%;
      animation:float 15s linear infinite;
      opacity:0.4;
    }

    @keyframes float{
      0%{
        transform:translateY(100vh) scale(0);
      }
      100%{
        transform:translateY(-10vh) scale(1);
      }
    }

    .glass{
      background:rgba(255,255,255,0.05);
      backdrop-filter:blur(12px);
      border:1px solid rgba(255,255,255,0.1);
      box-shadow:0 0 20px rgba(59,130,246,0.15);
    }

    .chat-scroll{
      scrollbar-width:thin;
      scrollbar-color:#3b82f6 transparent;
    }

    .chat-scroll::-webkit-scrollbar{
      width:5px;
    }

    .chat-scroll::-webkit-scrollbar-thumb{
      background:#3b82f6;
      border-radius:10px;
    }

    .typing span{
      animation:blink 1.2s infinite;
    }

    .typing span:nth-child(2){
      animation-delay:0.2s;
    }

    .typing span:nth-child(3){
      animation-delay:0.4s;
    }

    @keyframes blink{
      0%,100%{opacity:0.2}
      50%{opacity:1}
    }

    .glow{
      box-shadow:0 0 15px #3b82f6;
    }

    .startup{
      position:fixed;
      inset:0;
      background:#050816;
      display:flex;
      align-items:center;
      justify-content:center;
      flex-direction:column;
      z-index:9999;
      animation:hideSplash 4s forwards;
    }

    @keyframes hideSplash{
      0%,85%{opacity:1;visibility:visible}
      100%{opacity:0;visibility:hidden}
    }

    .logo{
      font-size:40px;
      font-weight:bold;
      background:linear-gradient(to right,#38bdf8,#8b5cf6);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      text-shadow:0 0 20px #38bdf8;
    }

    .sidebar{
      width:300px;
    }

    @media(max-width:768px){
      .sidebar{
        display:none;
      }
    }

  </style>
</head>
<body>

<div class="bg"></div>

<div class="particles" id="particles"></div>

<!-- Splash Screen -->
<div class="startup">
  <div class="logo">Umair AI Studio</div>
  <div class="mt-4 text-blue-300 animate-pulse">
    Initializing AI Systems...
  </div>
</div>

<div class="flex h-screen">

  <!-- Sidebar -->
  <div class="sidebar glass p-4 flex flex-col">
    <div class="text-2xl font-bold mb-5 text-cyan-400">
      Umair AI Studio
    </div>

    <button onclick="newChat()" class="bg-blue-600 hover:bg-blue-700 transition p-3 rounded-xl mb-4 glow">
      + New Chat
    </button>

    <div class="flex-1 overflow-y-auto chat-scroll" id="history"></div>

    <button onclick="openSettings()" class="mt-4 p-3 rounded-xl bg-purple-600 hover:bg-purple-700">
      Admin Settings
    </button>
  </div>

  <!-- Main -->
  <div class="flex-1 flex flex-col">

    <!-- Header -->
    <div class="glass p-4 flex justify-between items-center">
      <div>
        <h1 class="text-2xl font-bold text-cyan-400">
          Umair AI Studio
        </h1>
        <p class="text-sm text-gray-300">
          Premium AI Assistant
        </p>
      </div>

      <button onclick="clearChats()" class="bg-red-500 hover:bg-red-600 px-4 py-2 rounded-xl">
        Clear Chats
      </button>
    </div>

    <!-- Chat -->
    <div id="chatBox" class="flex-1 overflow-y-auto p-4 space-y-4 chat-scroll">

      <div class="glass p-5 rounded-2xl">
        <h2 class="text-2xl text-cyan-400 mb-2">
          Welcome to Umair AI Studio
        </h2>
        <p class="text-gray-300">
          Chat, analyze images, generate AI art, and experience futuristic AI.
        </p>
      </div>

    </div>

    <!-- Upload Preview -->
    <div id="previewContainer" class="px-4 hidden">
      <img id="previewImage" class="w-32 rounded-2xl border border-cyan-500"/>
    </div>

    <!-- Input -->
    <div class="glass p-4">

      <div class="flex gap-2 mb-3">

        <input
          type="file"
          id="imageUpload"
          accept="image/*"
          capture="environment"
          class="hidden"
        />

        <button onclick="document.getElementById('imageUpload').click()"
          class="bg-purple-600 hover:bg-purple-700 px-4 py-2 rounded-xl">
          Upload Image
        </button>

        <button onclick="generateImage()"
          class="bg-cyan-600 hover:bg-cyan-700 px-4 py-2 rounded-xl">
          Generate Image
        </button>

        <button onclick="voiceInput()"
          class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded-xl">
          🎤 Voice
        </button>

      </div>

      <div class="flex gap-2">
        <textarea
          id="userInput"
          rows="1"
          placeholder="Message Umair AI Studio..."
          class="flex-1 bg-[#0f172a] border border-cyan-500 rounded-2xl p-4 outline-none resize-none"
        ></textarea>

        <button onclick="sendMessage()"
          class="bg-cyan-500 hover:bg-cyan-600 px-6 rounded-2xl glow">
          Send
        </button>
      </div>

    </div>

  </div>

</div>

<!-- Settings Modal -->
<div id="settingsModal"
class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50">

  <div class="glass p-6 rounded-3xl w-[90%] max-w-md">

    <h2 class="text-2xl font-bold mb-4 text-cyan-400">
      Admin Settings
    </h2>

    <input
      type="password"
      id="adminPass"
      placeholder="Enter Password"
      class="w-full p-3 rounded-xl bg-[#0f172a] mb-3"
    />

    <button onclick="checkPassword()"
      class="bg-blue-600 w-full py-3 rounded-xl">
      Unlock
    </button>

    <div id="settingsPanel" class="hidden mt-5">

      <input
        id="apiKey"
        placeholder="API Key"
        class="w-full p-3 rounded-xl bg-[#0f172a] mb-3"
      />

      <select id="modelSelect"
        class="w-full p-3 rounded-xl bg-[#0f172a] mb-3">

        <option>GPT-4o</option>
        <option>Gemini 1.5</option>
        <option>Claude 3</option>
        <option>OpenRouter</option>

      </select>

      <select id="providerSelect"
        class="w-full p-3 rounded-xl bg-[#0f172a] mb-3">

        <option>OpenAI</option>
        <option>Gemini</option>
        <option>Claude</option>
        <option>OpenRouter</option>
        <option>Custom API</option>

      </select>

      <button onclick="saveSettings()"
        class="bg-cyan-600 w-full py-3 rounded-xl">
        Save Settings
      </button>

    </div>

  </div>

</div>

<script>

  const chatBox = document.getElementById("chatBox");

  // Particles
  for(let i=0;i<60;i++){
    const p=document.createElement("div");
    p.className="particle";
    p.style.left=Math.random()*100+"%";
    p.style.animationDuration=(10+Math.random()*10)+"s";
    p.style.opacity=Math.random();
    p.style.top=Math.random()*100+"%";
    document.getElementById("particles").appendChild(p);
  }

  // Save chats
  function saveChats(){
    localStorage.setItem("umairChats", chatBox.innerHTML);
  }

  // Load chats
  window.onload=()=>{
    const saved=localStorage.getItem("umairChats");
    if(saved){
      chatBox.innerHTML=saved;
    }
  }

  // Send Message
  async function sendMessage(){

    const input=document.getElementById("userInput");
    const text=input.value.trim();

    if(!text) return;

    addMessage(text,"user");

    input.value="";

    typingEffect();

    setTimeout(()=>{
      removeTyping();

      addMessage(
        "✨ This is Umair AI Studio demo response.<br><br>You can connect OpenAI, Gemini, Claude, or OpenRouter APIs inside Admin Settings.",
        "ai"
      );

    },1500);

  }

  // Add Message
  function addMessage(text,type){

    const div=document.createElement("div");

    div.className=
    type==="user"
    ?"ml-auto max-w-[80%] bg-cyan-600 p-4 rounded-3xl"
    :"mr-auto max-w-[80%] glass p-4 rounded-3xl";

    div.innerHTML=`
      <div>${marked.parse(text)}</div>

      <div class="flex gap-2 mt-3">
        <button onclick="copyText(this)"
        class="text-xs bg-black/30 px-3 py-1 rounded-lg">
        Copy
        </button>

        <button onclick="this.parentElement.parentElement.remove();saveChats()"
        class="text-xs bg-red-500 px-3 py-1 rounded-lg">
        Delete
        </button>
      </div>
    `;

    chatBox.appendChild(div);

    chatBox.scrollTop=chatBox.scrollHeight;

    saveChats();

  }

  // Copy
  function copyText(btn){
    navigator.clipboard.writeText(
      btn.parentElement.parentElement.innerText
    );
    alert("Copied");
  }

  // Typing
  function typingEffect(){

    const div=document.createElement("div");

    div.id="typing";

    div.className="glass p-4 rounded-3xl w-24";

    div.innerHTML=`
      <div class="typing">
        <span>.</span>
        <span>.</span>
        <span>.</span>
      </div>
    `;

    chatBox.appendChild(div);

    chatBox.scrollTop=chatBox.scrollHeight;

  }

  function removeTyping(){
    const t=document.getElementById("typing");
    if(t) t.remove();
  }

  // Clear
  function clearChats(){

    if(confirm("Clear all chats?")){
      chatBox.innerHTML="";
      saveChats();
    }

  }

  // New Chat
  function newChat(){
    chatBox.innerHTML="";
  }

  // Upload
  document.getElementById("imageUpload")
  .addEventListener("change",function(e){

    const file=e.target.files[0];

    if(!file) return;

    const reader=new FileReader();

    reader.onload=function(ev){

      document.getElementById("previewContainer")
      .classList.remove("hidden");

      document.getElementById("previewImage")
      .src=ev.target.result;

      addMessage(
        `<img src="${ev.target.result}" class="rounded-2xl w-52 mb-3"/>
        AI can now analyze this image.`,
        "user"
      );

    }

    reader.readAsDataURL(file);

  });

  // Image Generator
  function generateImage(){

    const prompt=prompt("Enter image prompt");

    if(!prompt) return;

    typingEffect();

    setTimeout(()=>{

      removeTyping();

      addMessage(
        `
        <img src="https://picsum.photos/500?random=${Math.random()}"
        class="rounded-2xl"/>

        <br>

        <a href="https://picsum.photos/1200"
        target="_blank"
        class="bg-cyan-600 px-4 py-2 rounded-xl inline-block mt-3">
        Download
        </a>
        `,
        "ai"
      );

    },2000);

  }

  // Settings
  function openSettings(){
    document.getElementById("settingsModal")
    .classList.remove("hidden");
  }

  function checkPassword(){

    const pass=document.getElementById("adminPass").value;

    if(pass==="121845"){

      document.getElementById("settingsPanel")
      .classList.remove("hidden");

      alert("Access Granted");

    }else{

      alert("Wrong Password");

    }

  }

  function saveSettings(){

    const data={
      apiKey:
      btoa(document.getElementById("apiKey").value),

      model:
      document.getElementById("modelSelect").value,

      provider:
      document.getElementById("providerSelect").value
    };

    localStorage.setItem(
      "umairSettings",
      JSON.stringify(data)
    );

    alert("Settings Saved Securely");

  }

  // Voice Input
  function voiceInput(){

    if(!('webkitSpeechRecognition' in window)){
      alert("Voice input not supported");
      return;
    }

    const recognition=
    new webkitSpeechRecognition();

    recognition.lang='en-US';

    recognition.start();

    recognition.onresult=function(event){

      document.getElementById("userInput").value=
      event.results[0][0].transcript;

    }

  }

  // Drag Drop
  document.body.addEventListener("dragover",(e)=>{
    e.preventDefault();
  });

  document.body.addEventListener("drop",(e)=>{
    e.preventDefault();

    const file=e.dataTransfer.files[0];

    if(file && file.type.startsWith("image/")){

      const reader=new FileReader();

      reader.onload=function(ev){

        addMessage(
          `<img src="${ev.target.result}"
          class="rounded-2xl w-52"/>`,
          "user"
        );

      }

      reader.readAsDataURL(file);

    }

  });

</script>

</body>
</html>
```
