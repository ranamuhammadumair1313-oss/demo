<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Angry Birds - Unlimited Edition</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: url('https://img.freepik.com/free-vector/nature-landscape-with-green-hills-blue-sky_107791-10515.jpg') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Courier New', Courier, monospace;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            text-shadow: 3px 3px 0px #000;
            pointer-events: none;
            z-index: 10;
        }
        #score-board {
            font-size: 40px;
            color: #55ff55;
        }
        #brand {
            font-size: 28px;
            color: #ffffff;
            background: rgba(0,0,0,0.6);
            padding: 5px 15px;
            border: 3px solid #fff;
            display: inline-block;
            margin-top: 5px;
        }
        #info { font-size: 14px; color: #eee; margin-top: 5px; }
        button {
            pointer-events: all;
            padding: 10px 20px;
            background: #4a4a4a;
            color: white;
            border: 4px solid #000;
            cursor: pointer;
            font-weight: bold;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div id="ui">
        <div id="score-board">SCORE: <span id="score-val">0</span></div>
        <div id="brand">UMAIR STUDIO</div>
        <div id="info">Unlimited Birds Enabled!</div>
        <button onclick="location.reload()">RESTART GAME</button>
    </div>

    <script>
        // --- SCORE SYSTEM ---
        let currentScore = 0;
        function updateScore(points) {
            currentScore += points;
            document.getElementById('score-val').innerText = currentScore;
        }

        // --- BACKGROUND MUSIC ---
        const bgMusic = new Audio('https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3');
        bgMusic.loop = true;
        bgMusic.volume = 0.2;
        window.addEventListener('mousedown', () => { bgMusic.play().catch(() => {}); }, { once: true });

        const { Engine, Render, Runner, World, Bodies, Mouse, MouseConstraint, Constraint, Events } = Matter;

        const engine = Engine.create();
        const world = engine.world;

        const render = Render.create({
            element: document.body,
            engine: engine,
            options: {
                width: window.innerWidth,
                height: window.innerHeight,
                wireframes: false,
                background: 'transparent'
            }
        });

        Render.run(render);
        const runner = Runner.create();
        Runner.run(runner, engine);

        // Ground
        const ground = Bodies.rectangle(window.innerWidth/2, window.innerHeight - 30, window.innerWidth, 60, { 
            isStatic: true, label: 'ground',
            render: { fillStyle: '#3d993d' } 
        });
        World.add(world, ground);

        // --- BIRD SPAWNING SYSTEM ---
        let currentBird;
        let sling;
        const anchor = { x: 250, y: window.innerHeight - 250 };

        function spawnBird() {
            // Naya Bird banana (Minecraft style)
            currentBird = Bodies.rectangle(anchor.x, anchor.y, 50, 50, {
                density: 0.005, restitution: 0.1, label: 'bird',
                render: { sprite: { texture: 'https://cdn-icons-png.flaticon.com/512/11516/11516104.png', xScale: 0.12, yScale: 0.12 } }
            });

            // Gulel (Sling) ko bird se connect karna
            sling = Constraint.create({
                pointA: anchor,
                bodyB: currentBird,
                stiffness: 0.08,
                length: 0.1,
                render: { strokeStyle: '#4b4b4b', lineWidth: 6 }
            });

            World.add(world, [currentBird, sling]);

            // Memory Clean: Purana bird 10 second baad gayab ho jaye taaki game lag na ho
            const birdToRemove = currentBird;
            setTimeout(() => {
                if (birdToRemove !== currentBird) { // Check if it's not the one currently in sling
                    World.remove(world, birdToRemove);
                }
            }, 10000);
        }

        spawnBird();

        // --- MINECRAFT STRUCTURE (3 PIGS STACKED) ---
        function createBlock(x, y, isPig) {
            return Bodies.rectangle(x, y, 65, 65, {
                label: isPig ? 'pig' : 'block',
                restitution: 0.1, friction: 0.5,
                render: { 
                    sprite: { 
                        texture: isPig ? 'https://p16-common-sign.tiktokcdn.com/tos-alisg-avt-0068/97712c69667ccc93652a9b9881b30608~tplv-tiktokx-cropcenter:1080:1080.jpeg?dr=14579&refresh_token=714a5b74&x-expires=1775192400&x-signature=QrogzCFYf74kHq2h13RI1K8hwI8%3D&t=4d5b0474&ps=13740610&shp=a5d48078&shcp=81f88b70&idc=sg1' : 'https://p16-common-sign.tiktokcdn.com/tos-alisg-avt-0068/97712c69667ccc93652a9b9881b30608~tplv-tiktokx-cropcenter:1080:1080.jpeg?dr=14579&refresh_token=714a5b74&x-expires=1775192400&x-signature=QrogzCFYf74kHq2h13RI1K8hwI8%3D&t=4d5b0474&ps=13740610&shp=a5d48078&shcp=81f88b70&idc=sg1', 
                        xScale: 0.13, yScale: 0.13 
                    } 
                }
            });
        }

        const stackX = window.innerWidth - 350;
        const baseY = window.innerHeight - 80;

        World.add(world, [
            createBlock(stackX, baseY, false),
            createBlock(stackX, baseY - 70, true),   // Pig 1
            createBlock(stackX, baseY - 140, false),
            createBlock(stackX, baseY - 210, true),  // Pig 2
            createBlock(stackX, baseY - 280, false),
            createBlock(stackX, baseY - 350, true)   // Pig 3
        ]);

        // Mouse Control
        const mouse = Mouse.create(render.canvas);
        const mouseConstraint = MouseConstraint.create(engine, {
            mouse: mouse, constraint: { stiffness: 0.2, render: { visible: false } }
        });
        World.add(world, mouseConstraint);

        // --- RELAUNCH LOGIC (Unlimited Birds) ---
        let isFired = false;

        Events.on(mouseConstraint, 'enddrag', (e) => {
            if (e.body === currentBird) {
                isFired = true;
            }
        });

        Events.on(engine, 'afterUpdate', () => {
            // Agar bird kheencha aur chhoda gaya hai
            if (isFired && currentBird.position.x > anchor.x + 20) {
                // Sling se azad karo
                World.remove(world, sling);
                isFired = false;

                // Naya bird turant (1 sec baad) spawn karo
                setTimeout(() => {
                    spawnBird();
                }, 1000);
            }
        });

        // --- SCORE LOGIC ---
        Events.on(engine, 'collisionStart', (event) => {
            event.pairs.forEach(pair => {
                const { bodyA, bodyB } = pair;
                updateScore(5); // Basic hit points

                if (bodyA.label === 'pig' || bodyB.label === 'pig') {
                    const pig = bodyA.label === 'pig' ? bodyA : bodyB;
                    if (pair.collision.speed > 3.5) {
                        World.remove(world, pig);
                        updateScore(1000); // Big bonus for pig
                    }
                }
            });
        });

        window.addEventListener('resize', () => {
            render.canvas.width = window.innerWidth;
            render.canvas.height = window.innerHeight;
        });

    </script>
</body>
</html>
